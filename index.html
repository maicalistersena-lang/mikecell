            background: linear-gradient(135deg, #F3DCBA 0%, #C5A880 50%, #9E7F56 100%);

            -webkit-text-fill-color: transparent;
        }
        .gold-btn {
            background: linear-gradient(135deg, #DFC298 0%, #C5A880 55%, #A6885E 100%);
            box-shadow: 0 4px 20px rgba(197, 168, 128, 0.35);
        }
        .gold-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
